<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سجل المرضى </title>
    <!-- Bootstrap RTL -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <!-- Google Fonts (Cairo) -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --primary-soft: #eff6ff;
            --bg-main: #f1f5f9;
            --surface: #ffffff;
            --border: #e2e8f0;
            --text-title: #0f172a;
            --text-body: #334155;
            --text-muted: #64748b;
            --radius-lg: 16px;
            --radius-md: 10px;
            --shadow-sm: 0 1px 3px rgba(0,0,0,0.05);
            --shadow-md: 0 4px 20px -2px rgba(0,0,0,0.05);
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-body);
            font-family: 'Cairo', sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        /* Top Bar */
        .app-bar {
            background: var(--surface);
            border-bottom: 1px solid var(--border);
            padding: 16px 0;
            margin-bottom: 30px;
            box-shadow: var(--shadow-sm);
        }
        
        .app-brand {
            font-weight: 800;
            font-size: 1.35rem;
            color: var(--primary);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        /* Cards Layout */
        .main-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-md);
            overflow: hidden;
            margin-bottom: 24px;
        }

        .main-card-header {
            background: #fafafa;
            border-bottom: 1px solid var(--border);
            padding: 18px 24px;
            font-weight: 700;
            color: var(--text-title);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        /* Section Separator inside Form */
        .section-label {
            font-size: 0.85rem;
            font-weight: 700;
            text-transform: uppercase;
            color: var(--primary);
            letter-spacing: 0.5px;
            margin-bottom: 14px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .section-label::after {
            content: "";
            flex: 1;
            height: 1px;
            background: var(--border);
        }

        /* Form Inputs Modernization */
        .form-label {
            font-weight: 600;
            font-size: 0.9rem;
            color: var(--text-title);
            margin-bottom: 6px;
        }

        .form-control, .form-select {
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            padding: 10px 14px;
            font-size: 0.95rem;
            background-color: #f8fafc;
            transition: all 0.2s ease;
        }

        .form-control:focus, .form-select:focus {
            background-color: #fff;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
        }

        /* Radio Toggle Switch Styling */
        .segmented-control {
            display: flex;
            background: #f1f5f9;
            padding: 4px;
            border-radius: var(--radius-md);
            gap: 4px;
        }

        .segmented-control .btn-check + .btn {
            flex: 1;
            border: none;
            border-radius: 8px;
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-muted);
            padding: 8px;
        }

        .segmented-control .btn-check:checked + .btn {
            background: #fff;
            color: var(--primary);
            box-shadow: var(--shadow-sm);
        }

        /* Patient Accordion Modernization */
        .accordion-item {
            border: 1px solid var(--border) !important;
            border-radius: var(--radius-md) !important;
            margin-bottom: 12px;
            overflow: hidden;
            box-shadow: var(--shadow-sm);
        }

        .accordion-button {
            padding: 16px 20px;
            font-weight: 600;
            background: #ffffff;
        }

        .accordion-button:not(.collapsed) {
            background: var(--primary-soft);
            color: var(--primary);
            box-shadow: none;
        }

        .visit-card {
            border: 1px solid var(--border);
            border-right: 4px solid var(--primary) !important;
            background: #ffffff;
            border-radius: var(--radius-md);
            padding: 14px;
            margin-top: 10px;
        }

        .file-badge {
            font-size: 0.78rem;
            padding: 5px 10px;
            border-radius: 6px;
            font-weight: 600;
        }

        .btn-custom {
            border-radius: var(--radius-md);
            padding: 10px 18px;
            font-weight: 700;
        }
    </style>
</head>
<body>

    <!-- Header / Navbar -->
    <nav class="app-bar">
        <div class="container d-flex justify-content-between align-items-center">
            <div class="app-brand">
                <i class="fa-solid fa-heart-pulse text-primary fs-3"></i>
                <span> عيادة </span>
            </div>
            <a href="/api/backup" class="btn btn-sm btn-outline-primary fw-bold rounded-pill px-3">
                <i class="fa-solid fa-cloud-arrow-down me-1"></i> نسخة احتياطية
            </a>
        </div>
    </nav>

    <div class="container mb-5">
        <div class="row g-4">
            
            <!-- العمود الأيمن: نموذج الإدخال والتعديل -->
            <div class="col-lg-5">
                <div class="main-card">
                    <div class="main-card-header">
                        <span id="formTitle"><i class="fa-solid fa-user-plus me-2 text-primary"></i>تسجيل زيارة جديدة</span>
                        <button class="btn btn-sm btn-light border text-danger d-none fw-semibold" id="resetBtn" onclick="resetForm()">إلغاء التعديل</button>
                    </div>
                    
                    <div class="card-body p-4">
                        <form id="visitForm" enctype="multipart/form-data">
                            <input type="hidden" id="visitId" name="visitId">
                            <input type="hidden" id="patientId" name="patientId">

                            <!-- بيانات المريض الأساسية -->
                            <div class="section-label">
                                <i class="fa-solid fa-id-card"></i> بيانات المريض
                            </div>

                            <div class="mb-3">
                                <label class="form-label">اسم المريض الرباعي <span class="text-danger">*</span></label>
                                <input type="text" class="form-control" id="name" name="name" required placeholder="أدخل اسم المريض">
                            </div>

                            <div class="row g-2 mb-3">
                                <div class="col-6">
                                    <label class="form-label">السن</label>
                                    <input type="number" class="form-control" id="age" name="age" placeholder="مثال: 35">
                                </div>
                                <div class="col-6">
                                    <label class="form-label">رقم الهاتف <span class="text-danger">*</span></label>
                                    <input type="text" class="form-control" id="phone" name="phone" required placeholder="01xxxxxxxxx">
                                </div>
                            </div>

                            <!-- تفاصيل الزيارة -->
                            <div class="section-label mt-4">
                                <i class="fa-solid fa-stethoscope"></i> تفاصيل الزيارة
                            </div>

                            <div class="row g-2 mb-3">
                                <div class="col-6">
                                    <label class="form-label">تاريخ الزيارة</label>
                                    <input type="date" class="form-control" id="visitDate" name="visitDate">
                                </div>
                                <div class="col-6">
                                    <label class="form-label">نوع الزيارة</label>
                                    <select class="form-select" id="visitType" name="visitTypeSelect" onchange="toggleCustomInput('visitType', 'customVisitTypeDiv')">
                                        <option value="كشف">كشف</option>
                                        <option value="متابعه">متابعة</option>
                                        <option value="استشارة">استشارة</option>
                                        <option value="آخر">آخر</option>
                                    </select>
                                </div>
                            </div>

                            <div class="mb-3 d-none" id="customVisitTypeDiv">
                                <input type="text" class="form-control" id="customVisitType" placeholder="حدد نوع الزيارة الآخر...">
                            </div>

                            <div class="mb-3">
                                <label class="form-label">التشخيص الطبي</label>
                                <select class="form-select" id="diagnosis" name="diagnosisSelect" onchange="toggleCustomInput('diagnosis', 'customDiagnosisDiv')">
                                    <option value="">اختر التشخيص...</option>
                                    <option value="ارتفاع ضغط الدم">ارتفاع ضغط الدم</option>
                                    <option value="قصور بالشرايين التاجية">قصور بالشرايين التاجية</option>
                                    <option value="ضعف بعضلة القلب">ضعف بعضلة القلب</option>
                                    <option value="آخر">آخر</option>
                                </select>
                            </div>

                            <div class="mb-3 d-none" id="customDiagnosisDiv">
                                <input type="text" class="form-control" id="customDiagnosis" placeholder="أدخل التشخيص المخصص...">
                            </div>

                            <!-- العلاج والروشتة -->
                            <div class="mb-3">
                                <label class="form-label d-block">طريقة تقديم الروشتة</label>
                                <div class="segmented-control">
                                    <input type="radio" class="btn-check" name="medicationType" id="medTextRadio" value="text" checked onclick="toggleMedicationType('text')">
                                    <label class="btn" for="medTextRadio"><i class="fa-solid fa-pen-nib me-1"></i> نصية</label>

                                    <input type="radio" class="btn-check" name="medicationType" id="medFileRadio" value="file" onclick="toggleMedicationType('file')">
                                    <label class="btn" for="medFileRadio"><i class="fa-solid fa-file-arrow-up me-1"></i> رفع ملف/صورة</label>
                                </div>
                            </div>

                            <div class="mb-3" id="medTextInput">
                                <textarea class="form-control" id="medicationText" name="medicationText" rows="3" placeholder="أكتب الأدوية والجرعات بالتفصيل..."></textarea>
                            </div>

                            <div class="mb-3 d-none" id="medFileInput">
                                <input type="file" class="form-control" id="medicationFile" name="medicationFile">
                            </div>

                            <!-- المرفقات والفحوصات -->
                            <div class="section-label mt-4">
                                <i class="fa-solid fa-folder-open"></i> الفحوصات والتحاليل
                            </div>

                            <div class="row g-2 mb-3">
                                <div class="col-6">
                                    <label class="form-label small">رسم قلب (ECG)</label>
                                    <input type="file" class="form-control form-control-sm" id="ecgFile" name="ecgFile">
                                </div>
                                <div class="col-6">
                                    <label class="form-label small">أشعة إيكو / سينية</label>
                                    <input type="file" class="form-control form-control-sm" id="raysFile" name="raysFile">
                                </div>
                                <div class="col-6">
                                    <label class="form-label small">أشعات أخرى</label>
                                    <input type="file" class="form-control form-control-sm" id="otherRaysFile" name="otherRaysFile">
                                </div>
                                <div class="col-6">
                                    <label class="form-label small">تحاليل طبية</label>
                                    <input type="file" class="form-control form-control-sm" id="labsFile" name="labsFile">
                                </div>
                            </div>

                            <button type="submit" class="btn btn-primary w-100 btn-custom mt-3">
                                <i class="fa-solid fa-floppy-disk me-1"></i> حفظ البيانات بالكامل
                            </button>
                        </form>
                    </div>
                </div>
            </div>

            <!-- العمود الأيسر: عرض السجلات والبحث -->
            <div class="col-lg-7">
                <div class="main-card">
                    <div class="main-card-header">
                        <span><i class="fa-solid fa-users me-2 text-primary"></i>قائمة المرضى المسجلين</span>
                    </div>
                    <div class="card-body p-4">
                        
                        <!-- شريط البحث -->
                        <div class="input-group mb-4">
                            <span class="input-group-text bg-light border-end-0"><i class="fa-solid fa-magnifying-glass text-muted"></i></span>
                            <input type="text" class="form-control border-start-0" id="searchInput" placeholder="ابحث باسم المريض أو رقم الهاتف..." onkeyup="searchPatients()">
                        </div>

                        <!-- قائمة المرضى -->
                        <div id="patientsAccordion" class="accordion"></div>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <!-- Script Logic -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            loadPatients();
            document.getElementById('visitDate').valueAsDate = new Date();
        });

        function escapeHTML(str) {
            if (!str) return '';
            return String(str).replace(/[&<>"']/g, match => ({
                '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
            }[match]));
        }

        function toggleCustomInput(selectId, targetDivId) {
            const select = document.getElementById(selectId);
            const targetDiv = document.getElementById(targetDivId);
            if (select.value === 'آخر') {
                targetDiv.classList.remove('d-none');
            } else {
                targetDiv.classList.add('d-none');
            }
        }

        function toggleMedicationType(type) {
            if (type === 'text') {
                document.getElementById('medTextInput').classList.remove('d-none');
                document.getElementById('medFileInput').classList.add('d-none');
                document.getElementById('medicationFile').value = ''; 
            } else {
                document.getElementById('medTextInput').classList.add('d-none');
                document.getElementById('medFileInput').classList.remove('d-none');
                document.getElementById('medicationText').value = ''; 
            }
        }

        async function loadPatients(query = '') {
            try {
                const res = await fetch(`/api/patients?q=${encodeURIComponent(query)}`);
                const patients = await res.json();
                const accordion = document.getElementById('patientsAccordion');
                accordion.innerHTML = '';

                if (!patients || patients.length === 0) {
                    accordion.innerHTML = '<div class="text-center text-muted p-5 bg-light rounded"><i class="fa-regular fa-folder-open fs-1 mb-2 d-block"></i>لا توجد سجلات مطابقة.</div>';
                    return;
                }

                patients.forEach((patient) => {
                    let visitsHTML = '';
                    if (patient.visits && patient.visits.length > 0) {
                        patient.visits.forEach(v => {
                            let filesBadges = '';
                            
                            if (v.medication_file) filesBadges += `<a href="${escapeHTML(v.medication_file)}" target="_blank" class="badge bg-primary-subtle text-primary border border-primary-subtle file-badge text-decoration-none me-1 mb-1"><i class="fa-solid fa-file-prescription"></i> الروشتة</a> `;
                            if (v.ecg_file) filesBadges += `<a href="${escapeHTML(v.ecg_file)}" target="_blank" class="badge bg-danger-subtle text-danger border border-danger-subtle file-badge text-decoration-none me-1 mb-1"><i class="fa-solid fa-heart-pulse"></i> رسم القلب</a> `;
                            if (v.rays_file) filesBadges += `<a href="${escapeHTML(v.rays_file)}" target="_blank" class="badge bg-info-subtle text-info border border-info-subtle file-badge text-decoration-none me-1 mb-1"><i class="fa-solid fa-x-ray"></i> أشعة/إيكو</a> `;
                            if (v.other_rays_file) filesBadges += `<a href="${escapeHTML(v.other_rays_file)}" target="_blank" class="badge bg-secondary-subtle text-secondary border border-secondary-subtle file-badge text-decoration-none me-1 mb-1"><i class="fa-solid fa-images"></i> أشعات أخرى</a> `;
                            if (v.labs_file) filesBadges += `<a href="${escapeHTML(v.labs_file)}" target="_blank" class="badge bg-warning-subtle text-warning border border-warning-subtle file-badge text-decoration-none me-1 mb-1"><i class="fa-solid fa-vial"></i> التحاليل</a> `;

                            visitsHTML += `
                                <div class="visit-card">
                                    <div class="d-flex justify-content-between align-items-start mb-2">
                                        <div>
                                            <span class="badge bg-primary me-1">${escapeHTML(v.visit_type || 'كشف')}</span>
                                            <small class="text-muted"><i class="fa-regular fa-calendar me-1"></i>${escapeHTML(v.visit_date || '')}</small>
                                            <h6 class="fw-bold mt-2 text-dark mb-0">التشخيص: ${escapeHTML(v.diagnosis || 'غير محدد')}</h6>
                                        </div>
                                        <button class="btn btn-sm btn-light text-danger border" onclick="deleteVisit(${v.id})" title="حذف الزيارة"><i class="fa-solid fa-trash-can"></i></button>
                                    </div>
                                    ${v.medication_text ? `<div class="p-2 bg-light rounded my-2"><small class="fw-bold d-block text-secondary mb-1">العلاج:</small><pre class="mb-0 text-wrap" style="font-family: inherit; font-size: 0.9rem;">${escapeHTML(v.medication_text)}</pre></div>` : ''}
                                    <div class="mt-2">${filesBadges}</div>
                                </div>
                            `;
                        });
                    } else {
                        visitsHTML = '<p class="text-muted small my-2">لا توجد زيارات مسجلة لهذا المريض.</p>';
                    }

                    accordion.innerHTML += `
                        <div class="accordion-item">
                            <h2 class="accordion-header" id="heading${patient.id}">
                                <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse" data-bs-target="#collapse${patient.id}">
                                    <div class="d-flex justify-content-between align-items-center w-100 me-3">
                                        <span class="fw-bold">${escapeHTML(patient.name)}</span>
                                        <span class="badge bg-light text-secondary border me-3"><i class="fa-solid fa-phone me-1"></i>${escapeHTML(patient.phone)}</span>
                                    </div>
                                </button>
                            </h2>
                            <div id="collapse${patient.id}" class="accordion-collapse collapse" data-bs-parent="#patientsAccordion">
                                <div class="accordion-body bg-white">
                                    <div class="d-flex justify-content-between align-items-center mb-3 pb-2 border-bottom">
                                        <span><strong>السن:</strong> ${patient.age || 'غير محدد'} سنة</span>
                                        <div>
                                            <button class="btn btn-sm btn-primary-subtle text-primary me-1 fw-bold" onclick="addNewVisitForPatient(${patient.id}, '${escapeHTML(patient.name)}', '${escapeHTML(patient.phone)}', ${patient.age})"><i class="fa-solid fa-plus me-1"></i> إضافة زيارة</button>
                                            <button class="btn btn-sm btn-outline-danger" onclick="deletePatient(${patient.id})"><i class="fa-solid fa-trash me-1"></i> حذف</button>
                                        </div>
                                    </div>
                                    <h6 class="fw-bold text-muted mb-2 small"><i class="fa-solid fa-clock-rotate-left me-1"></i> سجل الزيارات:</h6>
                                    ${visitsHTML}
                                </div>
                            </div>
                        </div>
                    `;
                });
            } catch (err) {
                console.error("خطأ في جلب البيانات:", err);
            }
        }

        document.getElementById('visitForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const formData = new FormData(e.target);

            const visitTypeSelect = document.getElementById('visitType').value;
            const finalVisitType = (visitTypeSelect === 'آخر') ? document.getElementById('customVisitType').value : visitTypeSelect;
            formData.set('visitType', finalVisitType);

            const diagnosisSelect = document.getElementById('diagnosis').value;
            const finalDiagnosis = (diagnosisSelect === 'آخر') ? document.getElementById('customDiagnosis').value : diagnosisSelect;
            formData.set('diagnosis', finalDiagnosis);

            try {
                const res = await fetch('/api/visit', {
                    method: 'POST',
                    body: formData
                });
                const result = await res.json();

                if (res.ok) {
                    alert('تم حفظ البيانات بنجاح!');
                    resetForm();
                    loadPatients();
                } else {
                    alert(`خطأ: ${result.error || 'حدث خطأ غير معروف'}`);
                }
            } catch (err) {
                alert('حدث خطأ أثناء الاتصال بالسيرفر.');
            }
        });

        function addNewVisitForPatient(patientId, name, phone, age) {
            resetForm();
            document.getElementById('patientId').value = patientId;
            document.getElementById('name').value = name;
            document.getElementById('phone').value = phone;
            document.getElementById('age').value = age || '';
            document.getElementById('formTitle').innerHTML = `<i class="fa-solid fa-plus me-2 text-primary"></i>إضافة زيارة لـ: ${name}`;
            document.getElementById('resetBtn').classList.remove('d-none');
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        async function deletePatient(id) {
            if (!confirm('هل أنت تأكد من حذف هذا المريض بكافة زياراته وملفاته؟')) return;
            try {
                const res = await fetch(`/api/patient/${id}`, { method: 'DELETE' });
                if (res.ok) {
                    loadPatients();
                } else {
                    alert('فشل حذف المريض');
                }
            } catch (err) {
                alert('خطأ في شبكة الاتصال');
            }
        }

        async function deleteVisit(id) {
            if (!confirm('هل أنت تأكد من حذف هذه الزيارة؟')) return;
            try {
                const res = await fetch(`/api/visit/${id}`, { method: 'DELETE' });
                if (res.ok) {
                    loadPatients();
                } else {
                    alert('فشل حذف الزيارة');
                }
            } catch (err) {
                alert('خطأ في شبكة الاتصال');
            }
        }

        function searchPatients() {
            const query = document.getElementById('searchInput').value;
            loadPatients(query);
        }

        function resetForm() {
            document.getElementById('visitForm').reset();
            document.getElementById('visitId').value = '';
            document.getElementById('patientId').value = '';
            document.getElementById('visitDate').valueAsDate = new Date();
            document.getElementById('formTitle').innerHTML = '<i class="fa-solid fa-user-plus me-2 text-primary"></i>تسجيل زيارة جديدة';
            document.getElementById('resetBtn').classList.add('d-none');
            toggleMedicationType('text');
            document.getElementById('customVisitTypeDiv').classList.add('d-none');
            document.getElementById('customDiagnosisDiv').classList.add('d-none');
        }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
