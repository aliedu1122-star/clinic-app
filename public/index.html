<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام إدارة العيادة</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap');
        body { font-family: 'Cairo', sans-serif; }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen">

    <!-- Header / Navbar -->
    <header class="bg-slate-800 border-b border-slate-700 sticky top-0 z-50 shadow-md">
        <div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">
            <div class="flex items-center gap-3">
                <i class="fa-solid fa-stethoscope text-emerald-400 text-2xl"></i>
                <h1 class="text-xl font-bold text-white">نظام إدارة العيادة</h1>
            </div>
            <a href="/api/backup" target="_blank" class="bg-emerald-600 hover:bg-emerald-500 text-white px-4 py-2 rounded-lg text-sm font-semibold transition flex items-center gap-2">
                <i class="fa-solid fa-download"></i> تحميل نسخة احتياطية
            </a>
        </div>
    </header>

    <!-- Main Container -->
    <main class="max-w-7xl mx-auto px-4 py-8 grid grid-cols-1 lg:grid-cols-12 gap-8">

        <!-- Form Section (Left / Top on Mobile) -->
        <section class="lg:col-span-5 bg-slate-800 p-6 rounded-2xl border border-slate-700 shadow-xl h-fit">
            <div class="flex justify-between items-center mb-6">
                <h2 id="formTitle" class="text-lg font-bold text-emerald-400 flex items-center gap-2">
                    <i class="fa-solid fa-user-plus"></i> تسجيل زيارة جديدة
                </h2>
                <button type="button" onclick="resetForm()" class="text-xs text-slate-400 hover:text-white underline">
                    إلغاء التعديل / تفريغ
                </button>
            </div>

            <form id="visitForm" class="space-y-4" onsubmit="handleFormSubmit(event)">
                <input type="hidden" id="visitId" name="visitId" value="">
                <input type="hidden" id="patientId" name="patientId" value="">

                <!-- Patient Data -->
                <div class="grid grid-cols-1 gap-4">
                    <div>
                        <label class="block text-sm font-semibold mb-1">اسم المريض *</label>
                        <input type="text" id="name" name="name" required class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-white focus:outline-none focus:border-emerald-500">
                    </div>
                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block text-sm font-semibold mb-1">رقم الهاتف *</label>
                            <input type="tel" id="phone" name="phone" required class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-white focus:outline-none focus:border-emerald-500">
                        </div>
                        <div>
                            <label class="block text-sm font-semibold mb-1">السن</label>
                            <input type="number" id="age" name="age" min="0" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-white focus:outline-none focus:border-emerald-500">
                        </div>
                    </div>
                </div>

                <hr class="border-slate-700 my-4">

                <!-- Visit Data -->
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-semibold mb-1">تاريخ الزيارة</label>
                        <input type="date" id="visitDate" name="visitDate" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-white focus:outline-none focus:border-emerald-500">
                    </div>
                    <div>
                        <label class="block text-sm font-semibold mb-1">نوع الزيارة</label>
                        <select id="visitType" name="visitType" onchange="toggleCustomType('visitType', 'customVisitTypeDiv')" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-white focus:outline-none focus:border-emerald-500">
                            <option value="كشف">كشف</option>
                            <option value="إعادة">إعادة</option>
                            <option value="آخر">آخر...</option>
                        </select>
                    </div>
                </div>

                <div id="customVisitTypeDiv" class="hidden">
                    <label class="block text-sm font-semibold mb-1">حدد نوع الزيارة</label>
                    <input type="text" id="customVisitType" name="customVisitType" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-white focus:outline-none focus:border-emerald-500">
                </div>

                <!-- Diagnosis -->
                <div>
                    <label class="block text-sm font-semibold mb-1">التشخيص</label>
                    <select id="diagnosis" name="diagnosis" onchange="toggleCustomType('diagnosis', 'customDiagnosisDiv')" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-white focus:outline-none focus:border-emerald-500 mb-2">
                        <option value="">اختر التشخيص...</option>
                        <option value="ضغط مرتفع">ضغط مرتفع</option>
                        <option value="قصور شرايين تاجية">قصور شرايين تاجية</option>
                        <option value="ضعف عضلة القلب">ضعف عضلة القلب</option>
                        <option value="آخر">آخر...</option>
                    </select>
                    <div id="customDiagnosisDiv" class="hidden">
                        <input type="text" id="customDiagnosis" name="customDiagnosis" placeholder="اكتب التشخيص هنا..." class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-white focus:outline-none focus:border-emerald-500">
                    </div>
                </div>

                <!-- Medication -->
                <div>
                    <label class="block text-sm font-semibold mb-1">الروشتة العلاجية</label>
                    <div class="flex gap-4 mb-2">
                        <label class="inline-flex items-center gap-1 text-sm cursor-pointer">
                            <input type="radio" name="medicationType" value="text" checked onclick="toggleMedicationView('text')" class="text-emerald-500"> نصية
                        </label>
                        <label class="inline-flex items-center gap-1 text-sm cursor-pointer">
                            <input type="radio" name="medicationType" value="file" onclick="toggleMedicationView('file')" class="text-emerald-500"> صورة / ملف
                        </label>
                    </div>

                    <div id="medTextDiv">
                        <textarea id="medicationText" name="medicationText" rows="3" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-white focus:outline-none focus:border-emerald-500" placeholder="اكتب العلاج والتفاصيل..."></textarea>
                    </div>
                    <div id="medFileDiv" class="hidden">
                        <input type="file" id="medicationFile" name="medicationFile" class="w-full text-sm text-slate-400 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-sm file:font-semibold file:bg-slate-700 file:text-white hover:file:bg-slate-600">
                    </div>
                </div>

                <!-- Attachments Checks & Uploads -->
                <div class="space-y-3 bg-slate-900/50 p-4 rounded-xl border border-slate-700/50">
                    <h3 class="text-xs font-bold text-slate-400 uppercase tracking-wider">الفحوصات والأشعات</h3>
                    
                    <!-- ECG -->
                    <div class="flex items-center justify-between">
                        <label class="inline-flex items-center gap-2 text-sm">
                            <input type="checkbox" id="hasEcg" name="hasEcg" value="نعم" onchange="toggleFileInput(this, 'ecgFileDiv')" class="rounded bg-slate-800 border-slate-700 text-emerald-500"> رسم قلب
                        </label>
                        <div id="ecgFileDiv" class="hidden w-1/2">
                            <input type="file" id="ecgFile" name="ecgFile" class="w-full text-xs text-slate-400">
                        </div>
                    </div>

                    <!-- Echo Rays -->
                    <div class="flex items-center justify-between">
                        <label class="inline-flex items-center gap-2 text-sm">
                            <input type="checkbox" id="hasRays" name="hasRays" value="نعم" onchange="toggleFileInput(this, 'raysFileDiv')" class="rounded bg-slate-800 border-slate-700 text-emerald-500"> إيكو / أشعة
                        </label>
                        <div id="raysFileDiv" class="hidden w-1/2">
                            <input type="file" id="raysFile" name="raysFile" class="w-full text-xs text-slate-400">
                        </div>
                    </div>

                    <!-- Other Rays -->
                    <div class="flex items-center justify-between">
                        <label class="inline-flex items-center gap-2 text-sm">
                            <input type="checkbox" id="hasOtherRays" name="hasOtherRays" value="نعم" onchange="toggleFileInput(this, 'otherRaysFileDiv')" class="rounded bg-slate-800 border-slate-700 text-emerald-500"> أشعات أخرى
                        </label>
                        <div id="otherRaysFileDiv" class="hidden w-1/2">
                            <input type="file" id="otherRaysFile" name="otherRaysFile" class="w-full text-xs text-slate-400">
                        </div>
                    </div>

                    <!-- Labs -->
                    <div class="flex items-center justify-between">
                        <label class="inline-flex items-center gap-2 text-sm">
                            <input type="checkbox" id="hasLabs" name="hasLabs" value="نعم" onchange="toggleFileInput(this, 'labsFileDiv')" class="rounded bg-slate-800 border-slate-700 text-emerald-500"> تحاليل
                        </label>
                        <div id="labsFileDiv" class="hidden w-1/2">
                            <input type="file" id="labsFile" name="labsFile" class="w-full text-xs text-slate-400">
                        </div>
                    </div>
                </div>

                <button type="submit" id="submitBtn" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-3 rounded-xl transition shadow-lg mt-4">
                    حفظ البيانات
                </button>
            </form>
        </section>

        <!-- Patients List Section (Right / Bottom on Mobile) -->
        <section class="lg:col-span-7 space-y-4">
            <!-- Search Bar -->
            <div class="relative">
                <i class="fa-solid fa-search absolute right-4 top-3.5 text-slate-400"></i>
                <input type="text" id="searchInput" oninput="debounceSearch()" placeholder="بحث باسم المريض أو رقم الهاتف..." class="w-full bg-slate-800 border border-slate-700 rounded-xl pr-11 pl-4 py-3 text-white focus:outline-none focus:border-emerald-500 shadow-md">
            </div>

            <!-- Patients Cards Container -->
            <div id="patientsContainer" class="space-y-4">
                <!-- Patient cards rendered here dynamically -->
            </div>
        </section>
    </main>

    <!-- Toast Notification -->
    <div id="toast" class="fixed bottom-5 left-5 hidden px-6 py-3 rounded-xl shadow-2xl text-white font-semibold z-50 transition-all"></div>

    <!-- Client Script -->
    <script>
        // XSS Prevention Utility
        function escapeHTML(str) {
            if (!str) return '';
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
        }

        // Setup default date to today
        document.getElementById('visitDate').valueAsDate = new Date();

        // UI Handlers
        function toggleCustomType(selectId, divId) {
            const val = document.getElementById(selectId).value;
            const div = document.getElementById(divId);
            div.classList.toggle('hidden', val !== 'آخر');
        }

        function toggleMedicationView(type) {
            document.getElementById('medTextDiv').classList.toggle('hidden', type !== 'text');
            document.getElementById('medFileDiv').classList.toggle('hidden', type !== 'file');
        }

        function toggleFileInput(checkbox, divId) {
            document.getElementById(divId).classList.toggle('hidden', !checkbox.checked);
        }

        function showToast(msg, isError = false) {
            const toast = document.getElementById('toast');
            toast.textContent = msg;
            toast.className = `fixed bottom-5 left-5 px-6 py-3 rounded-xl shadow-2xl text-white font-semibold z-50 transition-all ${isError ? 'bg-red-600' : 'bg-emerald-600'}`;
            toast.classList.remove('hidden');
            setTimeout(() => toast.classList.add('hidden'), 3500);
        }

        function resetForm() {
            document.getElementById('visitForm').reset();
            document.getElementById('visitId').value = '';
            document.getElementById('patientId').value = '';
            document.getElementById('formTitle').innerHTML = `<i class="fa-solid fa-user-plus"></i> تسجيل زيارة جديدة`;
            document.getElementById('visitDate').valueAsDate = new Date();
            
            toggleCustomType('visitType', 'customVisitTypeDiv');
            toggleCustomType('diagnosis', 'customDiagnosisDiv');
            toggleMedicationView('text');
            ['ecgFileDiv', 'raysFileDiv', 'otherRaysFileDiv', 'labsFileDiv'].forEach(id => document.getElementById(id).classList.add('hidden'));
        }

        // API Interactions
        async function handleFormSubmit(e) {
            e.preventDefault();
            const submitBtn = document.getElementById('submitBtn');
            submitBtn.disabled = true;
            submitBtn.innerText = "جاري الحفظ...";

            try {
                const formData = new FormData(e.target);
                const res = await fetch('/api/visit', { method: 'POST', body: formData });
                const data = await res.json();

                if (res.ok) {
                    showToast(data.message || 'تم الحفظ بنجاح');
                    resetForm();
                    loadPatients();
                } else {
                    showToast(data.error || 'حدث خطأ أثناء عملية الحفظ', true);
                }
            } catch (err) {
                showToast('عفواً، فشل الاتصال بالسيرفر!', true);
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerText = "حفظ البيانات";
            }
        }

        let searchTimeout;
        function debounceSearch() {
            clearTimeout(searchTimeout);
            searchTimeout = setTimeout(loadPatients, 300);
        }

        async function loadPatients() {
            const query = document.getElementById('searchInput').value;
            const container = document.getElementById('patientsContainer');

            try {
                const res = await fetch(`/api/patients?q=${encodeURIComponent(query)}`);
                if (!res.ok) throw new Error();
                const patients = await res.json();

                if (patients.length === 0) {
                    container.innerHTML = `<div class="bg-slate-800 p-8 rounded-2xl text-center text-slate-400">لا يوجد مرضى مسجلين حتى الآن.</div>`;
                    return;
                }

                // Optimization: Accumulate HTML string to minimize Reflows
                let htmlBuffer = '';

                patients.forEach(p => {
                    htmlBuffer += `
                        <div class="bg-slate-800 rounded-2xl p-5 border border-slate-700 shadow-md">
                            <div class="flex justify-between items-start mb-4">
                                <div>
                                    <h3 class="font-bold text-lg text-white">${escapeHTML(p.name)}</h3>
                                    <p class="text-xs text-slate-400 mt-1">
                                        <i class="fa-solid fa-phone"></i> ${escapeHTML(p.phone)} 
                                        ${p.age ? `| <i class="fa-solid fa-user"></i> ${escapeHTML(p.age)} سنة` : ''}
                                    </p>
                                </div>
                                <button onclick="deletePatient(${p.id})" class="text-red-400 hover:text-red-300 text-sm p-2 rounded-lg hover:bg-slate-700 transition" title="حذف الملف بالكامل">
                                    <i class="fa-solid fa-trash"></i>
                                </button>
                            </div>

                            <!-- Visits List -->
                            <div class="space-y-3 mt-3">
                                ${p.visits.map(v => `
                                    <div class="bg-slate-900 p-4 rounded-xl border border-slate-700/60 text-sm">
                                        <div class="flex justify-between items-center text-xs text-slate-400 mb-2">
                                            <span><i class="fa-solid fa-calendar-day text-emerald-400"></i> ${escapeHTML(v.visit_date)} (${escapeHTML(v.visit_type)})</span>
                                            <div class="flex gap-2">
                                                <button onclick='editVisit(${JSON.stringify(p).replace(/'/g, "&#39;")}, ${JSON.stringify(v).replace(/'/g, "&#39;")})' class="text-emerald-400 hover:underline">تعديل</button>
                                                <button onclick="deleteVisit(${v.id})" class="text-red-400 hover:underline">حذف</button>
                                            </div>
                                        </div>
                                        ${v.diagnosis ? `<p class="font-semibold text-slate-200 mb-2">التشخيص: <span class="text-emerald-300">${escapeHTML(v.diagnosis)}</span></p>` : ''}
                                        
                                        <!-- Medication -->
                                        ${v.medication_text ? `<p class="text-xs text-slate-300 bg-slate-800 p-2 rounded mb-2 whitespace-pre-line">${escapeHTML(v.medication_text)}</p>` : ''}
                                        ${v.medication_file ? `<a href="/uploads/${escapeHTML(v.medication_file)}" target="_blank" class="inline-block text-xs text-emerald-400 underline mb-2"><i class="fa-solid fa-file"></i> عرض الروشتة المرفقة</a>` : ''}

                                        <!-- Attachments -->
                                        <div class="flex flex-wrap gap-2 mt-2 pt-2 border-t border-slate-800 text-xs">
                                            ${v.ecg_file ? `<a href="/uploads/${escapeHTML(v.ecg_file)}" target="_blank" class="bg-slate-800 px-2 py-1 rounded text-slate-300 hover:text-white"><i class="fa-solid fa-heart-pulse text-red-400"></i> رسم قلب</a>` : ''}
                                            ${v.rays_file ? `<a href="/uploads/${escapeHTML(v.rays_file)}" target="_blank" class="bg-slate-800 px-2 py-1 rounded text-slate-300 hover:text-white"><i class="fa-solid fa-x-ray text-blue-400"></i> إيكو/أشعة</a>` : ''}
                                            ${v.other_rays_file ? `<a href="/uploads/${escapeHTML(v.other_rays_file)}" target="_blank" class="bg-slate-800 px-2 py-1 rounded text-slate-300 hover:text-white"><i class="fa-solid fa-images text-purple-400"></i> أشعات أخرى</a>` : ''}
                                            ${v.labs_file ? `<a href="/uploads/${escapeHTML(v.labs_file)}" target="_blank" class="bg-slate-800 px-2 py-1 rounded text-slate-300 hover:text-white"><i class="fa-solid fa-flask text-yellow-400"></i> تحاليل</a>` : ''}
                                        </div>
                                    </div>
                                `).join('')}
                            </div>
                        </div>
                    `;
                });

                container.innerHTML = htmlBuffer;
            } catch (err) {
                container.innerHTML = `<div class="bg-red-900/30 p-4 rounded-xl text-center text-red-400">فشل في تحميل سجل المرضى</div>`;
            }
        }

        function editVisit(patient, visit) {
            document.getElementById('visitId').value = visit.id;
            document.getElementById('patientId').value = patient.id;
            document.getElementById('name').value = patient.name;
            document.getElementById('phone').value = patient.phone;
            document.getElementById('age').value = patient.age || '';

            document.getElementById('visitDate').value = visit.visit_date;
            document.getElementById('visitType').value = ['كشف', 'إعادة'].includes(visit.visit_type) ? visit.visit_type : 'آخر';
            if (document.getElementById('visitType').value === 'آخر') {
                document.getElementById('customVisitType').value = visit.visit_type;
            }
            toggleCustomType('visitType', 'customVisitTypeDiv');

            document.getElementById('diagnosis').value = ['ضغط مرتفع', 'قصور شرايين تاجية', 'ضعف عضلة القلب'].includes(visit.diagnosis) ? visit.diagnosis : (visit.diagnosis ? 'آخر' : '');
            if (document.getElementById('diagnosis').value === 'آخر') {
                document.getElementById('customDiagnosis').value = visit.diagnosis;
            }
            toggleCustomType('diagnosis', 'customDiagnosisDiv');

            if (visit.medication_type === 'file') {
                document.querySelectorAll('input[name="medicationType"]')[1].checked = true;
                toggleMedicationView('file');
            } else {
                document.querySelectorAll('input[name="medicationType"]')[0].checked = true;
                document.getElementById('medicationText').value = visit.medication_text || '';
                toggleMedicationView('text');
            }

            document.getElementById('formTitle').innerHTML = `<i class="fa-solid fa-pen-to-square"></i> تعديل زيارة للمريض: ${escapeHTML(patient.name)}`;
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        async function deletePatient(id) {
            if (!confirm('هل أنت تأكد من حذف سجل المريض بكافة زياراته وملفاته نهائياً؟')) return;
            try {
                const res = await fetch(`/api/patient/${id}`, { method: 'DELETE' });
                const data = await res.json();
                if (res.ok) {
                    showToast(data.message);
                    loadPatients();
                } else {
                    showToast(data.error, true);
                }
            } catch (err) {
                showToast('فشل في الاتصال بالسيرفر', true);
            }
        }

        async function deleteVisit(id) {
            if (!confirm('هل أنت تأكد من حذف هذه الزيارة وملفاتها؟')) return;
            try {
                const res = await fetch(`/api/visit/${id}`, { method: 'DELETE' });
                const data = await res.json();
                if (res.ok) {
                    showToast(data.message);
                    loadPatients();
                } else {
                    showToast(data.error, true);
                }
            } catch (err) {
                showToast('فشل في الاتصال بالسيرفر', true);
            }
        }

        // Init
        loadPatients();
    </script>
</body>
</html>
