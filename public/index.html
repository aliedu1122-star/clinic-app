<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام إدارة العيادة</title>
    <style>
        :root {
            --primary-color: #0d6efd;
            --secondary-color: #6c757d;
            --bg-color: #f8f9fa;
            --card-bg: #ffffff;
            --border-color: #dee2e6;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, sans-serif; }
        body { background-color: var(--bg-color); padding: 20px; max-width: 900px; margin: 0 auto; }
        header { text-align: center; margin-bottom: 20px; }
        nav { display: flex; gap: 10px; margin-bottom: 20px; }
        .nav-btn { flex: 1; padding: 12px; border: 1px solid var(--border-color); background: var(--card-bg); cursor: pointer; font-size: 16px; font-weight: bold; border-radius: 6px; }
        .nav-btn.active { background-color: var(--primary-color); color: white; }
        .tab-content { display: none; background: var(--card-bg); padding: 20px; border-radius: 8px; border: 1px solid var(--border-color); }
        .tab-content.active { display: block; }
        .form-group { margin-bottom: 15px; }
        .section-title { font-size: 16px; font-weight: bold; color: var(--primary-color); margin: 20px 0 10px 0; border-bottom: 1px solid var(--border-color); padding-bottom: 5px; }
        label { display: block; margin-bottom: 6px; font-weight: 600; }
        input, textarea { width: 100%; padding: 10px; border: 1px solid var(--border-color); border-radius: 6px; }
        button.btn-submit { background-color: var(--primary-color); color: white; border: none; padding: 12px; font-size: 16px; border-radius: 6px; cursor: pointer; width: 100%; font-weight: bold; margin-top: 10px; }
        .result-card { border: 1px solid var(--border-color); padding: 15px; border-radius: 6px; margin-bottom: 12px; background: #fafafa; }
        .file-link { display: inline-block; padding: 6px 12px; background: #e9ecef; color: var(--primary-color); text-decoration: none; font-weight: bold; border-radius: 4px; margin-top: 5px; margin-left: 5px; }
    </style>
</head>
<body>

    <header><h1>نظام إدارة العيادة</h1></header>

    <nav>
        <button class="nav-btn active" data-tab="new-booking">حجز جديد / حالة</button>
        <button class="nav-btn" data-tab="search">البحث</button>
        <button class="nav-btn" data-tab="settings">النسخ الاحتياطي</button>
    </nav>

    <!-- تبويب حجز جديد -->
    <section id="new-booking" class="tab-content active">
        <form id="booking-form">
            <div class="form-group">
                <label>اسم المريض:</label>
                <input type="text" name="patient_name" required>
            </div>
            <div class="form-group">
                <label>رقم الهاتف:</label>
                <input type="tel" name="phone">
            </div>
            <div class="form-group">
                <label>تاريخ الموعد:</label>
                <input type="date" name="appointment_date">
            </div>
            <div class="form-group">
                <label>التشخيص (كتابة نصية):</label>
                <textarea name="diagnosis" rows="3"></textarea>
            </div>

            <div class="section-title">الروشتة (نصية / صورة)</div>
            <div class="form-group">
                <label>نص الروشتة:</label>
                <textarea name="prescription_text" rows="3" placeholder="اكتب الأدوية هنا..."></textarea>
            </div>
            <div class="form-group">
                <label>صورة الروشتة (اختياري):</label>
                <input type="file" name="prescription_file" accept="image/*">
            </div>

            <div class="section-title">الفحوصات والمرفقات</div>
            <div class="form-group">
                <label>صورة رسم قلب (ECG):</label>
                <input type="file" name="ecg_file" accept="image/*">
            </div>
            <div class="form-group">
                <label>صورة إيكو (Echo):</label>
                <input type="file" name="echo_file" accept="image/*">
            </div>
            <div class="form-group">
                <label>صورة أشعة (X-Ray):</label>
                <input type="file" name="xray_file" accept="image/*">
            </div>

            <div class="form-group">
                <label>ملاحظات إضافية:</label>
                <textarea name="notes" rows="2"></textarea>
            </div>

            <button type="submit" class="btn-submit">حفظ الحالة بالكامل</button>
        </form>
    </section>

    <!-- تبويب البحث -->
    <section id="search" class="tab-content">
        <div style="display: flex; gap: 10px; margin-bottom: 20px;">
            <input type="text" id="search-input" placeholder="ابحث باسم المريض أو التشخيص...">
            <button id="search-btn" style="padding: 10px 20px; cursor: pointer;">بحث</button>
        </div>
        <div id="search-results"></div>
    </section>

    <!-- تبويب النسخ الاحتياطي -->
    <section id="settings" class="tab-content">
        <h2>النسخ الاحتياطي</h2>
        <p style="margin: 10px 0;">تحميل البيانات والملفات والرفوعات كملف ZIP واحد.</p>
        <button id="download-backup-btn" class="btn-submit">تنزيل النسخة الاحتياطية (ZIP)</button>
    </section>

    <script src="app.js"></script>
</body>
</html>
