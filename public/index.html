<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إدارة عيادة أمراض القلب</title>
    <!-- Bootstrap 5 RTL -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.rtl.min.css">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <style>
        body {
            background-color: #f8f9fa;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .card {
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
            margin-bottom: 20px;
        }
        .patient-card {
            transition: transform 0.2s;
        }
        .patient-card:hover {
            transform: translateY(-2px);
        }
        .badge-custom {
            font-size: 0.85rem;
            padding: 6px 10px;
        }
    </style>
</head>
<body>

    <nav class="navbar navbar-dark bg-primary mb-4 shadow-sm">
        <div class="container">
            <span class="navbar-brand mb-0 h1">
                <i class="fa-solid fa-heart-pulse me-2"></i>نظام إدارة عيادة أمراض القلب
            </span>
        </div>
    </nav>

    <div class="container mb-5">
        <div class="row">
            
            <!-- قسم النموذج (تسجيل / تعديل) -->
            <div class="col-lg-5">
                <div class="card border-0">
                    <div class="card-header bg-white border-0 pt-3 pb-0">
                        <div class="d-flex justify-content-between align-items-center">
                            <h5 class="card-title text-primary fw-bold" id="formTitle">
                                <i class="fa-solid fa-user-plus me-2"></i>تسجيل زيارة جديدة
                            </h5>
                            <button type="button" class="btn btn-sm btn-outline-secondary d-none" id="resetBtn" onclick="resetForm()">
                                <i class="fa-solid fa-xmark me-1"></i>إلغاء التعديل
                            </button>
                        </div>
                    </div>
                    <div class="card-body">
                        <form id="visitForm" enctype="multipart/form-data">
                            <!-- حقول مخفية للتعرف على حالة التعديل -->
                            <input type="hidden" id="visitId" name="visitId" value="">
                            <input type="hidden" id="patientId" name="patientId" value="">

                            <!-- بيانات المريض -->
                            <h6 class="text-muted fw-bold border-bottom pb-2 mb-3">بيانات المريض</h6>
                            
                            <div class="mb-3">
                                <label class="form-label">اسم المريض <span class="text-danger">*</span></label>
                                <input type="text" class="form-control" id="name" name="name" required>
                            </div>

                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label class="form-label">رقم الهاتف <span class="text-danger">*</span></label>
                                    <input type="tel" class="form-control" id="phone" name="phone" required>
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label class="form-label">السن</label>
                                    <input type="number" class="form-control" id="age" name="age" min="1" max="120">
                                </div>
                            </div>

                            <!-- بيانات الزيارة -->
                            <h6 class="text-muted fw-bold border-bottom pb-2 mb-3 mt-2">تفاصيل الزيارة</h6>

                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label class="form-label">تاريخ الزيارة <span class="text-danger">*</span></label>
                                    <input type="date" class="form-control" id="visitDate" name="visitDate" required>
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label class="form-label">نوع الزيارة <span class="text-danger">*</span></label>
                                    <select class="form-select" id="visitType" name="visitType" onchange="toggleCustomInput('visitType', 'customVisitTypeDiv')" required>
                                        <option value="كشف">كشف</option>
                                        <option value="استشارة">استشارة</option>
                                        <option value="متابعة">متابعة</option>
                                        <option value="آخر">آخر</option>
                                    </select>
                                </div>
                            </div>

                            <div class="mb-3 d-none" id="customVisitTypeDiv">
                                <label class="form-label">حدد نوع الزيارة</label>
                                <input type="text" class="form-control" id="customVisitType" name="customVisitType">
                            </div>

                            <div class="mb-3">
                                <label class="form-label">التشخيص <span class="text-danger">*</span></label>
                                <select class="form-select" id="diagnosis" name="diagnosis" onchange="toggleCustomInput('diagnosis', 'customDiagnosisDiv')" required>
                                    <option value="ارتفاع ضغط الدم">ارتفاع ضغط الدم</option>
                                    <option value="قصور بالشرايين التاجية">قصور بالشرايين التاجية</option>
                                    <option value="ضعف بعضلة القلب">ضعف بعضلة القلب</option>
                                    <option value="آخر">آخر</option>
                                </select>
                            </div>

                            <div class="mb-3 d-none" id="customDiagnosisDiv">
                                <label class="form-label">حدد التشخيص</label>
                                <input type="text" class="form-control" id="customDiagnosis" name="customDiagnosis">
                            </div>

                            <!-- الروشتة -->
                            <h6 class="text-muted fw-bold border-bottom pb-2 mb-3 mt-2">الروشتة / العلاج</h6>

                            <div class="mb-3">
                                <div class="form-check form-check-inline">
                                    <input class="form-check-input" type="radio" name="medicationType" id="medTextRadio" value="text" checked onclick="toggleMedicationType('text')">
                                    <label class="form-check-label" for="medTextRadio">روشتة نصية</label>
                                </div>
                                <div class="form-check form-check-inline">
                                    <input class="form-check-input" type="radio" name="medicationType" id="medImageRadio" value="image" onclick="toggleMedicationType('image')">
                                    <label class="form-check-label" for="medImageRadio">صورة روشتة</label>
                                </div>
                            </div>

                            <div class="mb-3" id="medicationTextDiv">
                                <textarea class="form-control" id="medicationText" name="medicationText" rows="3" placeholder="اكتب تفاصيل العلاج والجرعات..."></textarea>
                            </div>

                            <div class="mb-3 d-none" id="medicationImageDiv">
                                <input type="file" class="form-control" id="medicationImage" name="medicationImage" accept="image/*">
                            </div>

                            <!-- المرفقات الأُخرى -->
                            <h6 class="text-muted fw-bold border-bottom pb-2 mb-3 mt-2">المرفقات (اختر الفئة)</h6>

                            <div class="mb-3">
                                <label class="form-label"><i class="fa-solid fa-wave-square me-1 text-danger"></i>رسم قلب (ECG)</label>
                                <input type="file" class="form-control" id="ecgFiles" name="ecgFiles" accept="image/*,.pdf" multiple>
                            </div>

                            <div class="mb-3">
                                <label class="form-label"><i class="fa-solid fa-ultrasound me-1 text-primary"></i>إيكو (Echo)</label>
                                <input type="file" class="form-control" id="echoFiles" name="echoFiles" accept="image/*,.pdf" multiple>
                            </div>

                            <div class="mb-3">
                                <label class="form-label"><i class="fa-solid fa-vial me-1 text-warning"></i>تحاليل (Labs)</label>
                                <input type="file" class="form-control" id="labFiles" name="labFiles" accept="image/*,.pdf" multiple>
                            </div>

                            <div class="mb-3">
                                <label class="form-label"><i class="fa-solid fa-box-archive me-1 text-secondary"></i>أخرى (Other)</label>
                                <input type="file" class="form-control" id="otherFiles" name="otherFiles" accept="image/*,.pdf" multiple>
                            </div>

                            <button type="submit" class="btn btn-primary w-100 fw-bold py-2 mt-3">
                                <i class="fa-solid fa-floppy-disk me-1"></i>حفظ البيانات
                            </button>
                        </form>
                    </div>
                </div>
            </div>

            <!-- قسم البحث وعرض المرضى -->
            <div class="col-lg-7">
                <div class="card border-0 mb-3">
                    <div class="card-body">
                        <div class="input-group">
                            <span class="input-group-text bg-white border-end-0"><i class="fa-solid fa-magnifying-glass text-muted"></i></span>
                            <input type="text" class="form-control border-start-0" id="searchInput" placeholder="ابحث باسم المريض أو رقم الهاتف..." oninput="loadPatients()">
                        </div>
                    </div>
                </div>

                <div id="patientsContainer">
                    <!-- سيتم تحميل كروت المرضى هنا عبر JavaScript -->
                </div>
            </div>

        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
